# /etc/nginx/sites-available/appro-test — environnement de RECETTE (branche test), port 3001
# Domaine : test.appro.promofood.cloud (DNS A -> 51.83.240.152), puis : certbot --nginx -d test.appro.promofood.cloud
# Accès protégé par un mot de passe Nginx en plus de la connexion au portail :
#   sudo apt -y install apache2-utils && sudo htpasswd -c /etc/nginx/appro-test.htpasswd recette

server {
    listen 80;
    listen [::]:80;
    server_name test.appro.promofood.cloud;

    client_max_body_size 12m;
    auth_basic "Portail appro - recette";
    auth_basic_user_file /etc/nginx/appro-test.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/appro-proxy.conf;
    }
}
