# /etc/nginx/conf.d/appro-protection.conf — protections générales (contexte http), installées par deploy/durcissement.sh

# Version de Nginx masquée sur toutes les réponses
server_tokens off;

# Lenteur volontaire (« slowloris ») : délais courts pour recevoir la requête
client_header_timeout 15s;
client_body_timeout 20s;
send_timeout 30s;
keepalive_timeout 30s;
large_client_header_buffers 4 16k;

# Débit et connexions simultanées par adresse IP (au-delà : réponse 429, journalisée pour fail2ban)
limit_req_zone $binary_remote_addr zone=appro_general:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=appro_conn:10m;
limit_req_status 429;
limit_conn_status 429;
