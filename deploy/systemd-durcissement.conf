# /etc/systemd/system/appro.service.d/durcissement.conf — confinement du processus Node.js :
# en cas de faille dans l'application, l'attaquant reste enfermé (pas de /home, pas de périphériques,
# pas de modules noyau, aucun privilège, réseau limité à IP et sockets locales).
[Service]
UMask=0027
ProtectHome=true
PrivateDevices=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
ProtectClock=true
ProtectHostname=true
RestrictSUIDSGID=true
RestrictRealtime=true
RestrictNamespaces=true
LockPersonality=true
SystemCallArchitectures=native
CapabilityBoundingSet=
AmbientCapabilities=
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
