# /etc/fail2ban/jail.d/appro.conf — bannissement automatique des adresses IP agressives (pare-feu)

[DEFAULT]
bantime  = 1h
findtime = 10m
# Récidive : bannissement de plus en plus long
bantime.increment = true
bantime.maxtime   = 1w
ignoreip = 127.0.0.1/8 ::1

# Essais de mots de passe SSH
[sshd]
enabled  = true
maxretry = 5

# Débit excessif refusé par Nginx (réponses 429)
[nginx-limit-req]
enabled  = true
port     = http,https
logpath  = /var/log/nginx/error.log
maxretry = 10

# Robots qui cherchent des fichiers ou des pages vulnérables
[nginx-botsearch]
enabled  = true
port     = http,https
logpath  = /var/log/nginx/access.log
maxretry = 5

# Échecs de connexion au portail (journal de l'application)
[appro-connexion]
enabled      = true
port         = http,https
filter       = appro-connexion
logpath      = /opt/appro/logs/app-*.log
logtimezone  = UTC
maxretry     = 8
findtime     = 15m
bantime      = 2h
