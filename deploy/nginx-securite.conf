# /etc/nginx/snippets/appro-securite.conf — inclus dans les blocs server du portail par deploy/durcissement.sh

limit_req zone=appro_general burst=80 nodelay;
limit_conn appro_conn 40;

# Fichiers cachés (.env, .git…) : jamais servis
location ~ /\.(?!well-known/) {
    return 404;
}

# Robots qui cherchent des failles connues d'autres logiciels : connexion coupée sans réponse
location ~* ^/(wp-admin|wp-login\.php|wp-content|xmlrpc\.php|cgi-bin|vendor/phpunit|boaform|HNAP1|actuator|solr|\.aws) {
    return 444;
}
