# /etc/nginx/sites-available/defaut-refus — refuse les requêtes qui ne visent pas le domaine du portail
# (accès direct par l'adresse IP, noms inconnus) : la plupart des robots d'attaque procèdent ainsi.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
