# /etc/nginx/sites-available/appro — reverse proxy HTTPS devant Next.js (port 3000)
# Domaine : appro.promofood.cloud (DNS A -> 51.83.240.152), puis : certbot --nginx -d appro.promofood.cloud

limit_req_zone $binary_remote_addr zone=connexion:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name appro.promofood.cloud;

    # Pièces jointes (8 Mo) et imports Excel (5 Mo) + marge
    client_max_body_size 12m;

    # Limite les tentatives de connexion par adresse IP (en plus du verrouillage applicatif)
    location = /connexion {
        limit_req zone=connexion burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/appro-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/appro-proxy.conf;
    }
}
